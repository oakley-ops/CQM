name: CI

# Runs on every pull request, and on pushes to the integration branch. Feature
# branches are validated via their PR (the pull_request trigger), so a PR runs
# CI once rather than twice. Two independent jobs (frontend, backend) run in
# parallel. Both are green today; see "Deferred checks" below.
#
# What runs:
#   frontend — npm ci, then `npm run build` (tsc typecheck + vite production
#              build), then uploads the built dist/ as a downloadable artifact.
#   backend  — npm ci against a Postgres service, then the unit test suite.
#
# Deferred checks (tracked in docs/KNOWN-ISSUES-BACKLOG.md, added here once fixed):
#   - Frontend eslint: the config extends "react-app", which isn't installed.
#   - Backend integration tests (tests/integration): pre-existing failures
#     (a legacy /api/facilities test, server-bootstrap on a fixed port).
# Keeping these out of the required checks keeps the pipeline honestly green
# rather than red-on-arrival.

on:
  # Post-merge validation of the integration branch (and main, if adopted later).
  push:
    branches: [cqm-transformation, main]
  # Pre-merge gate for every PR — this is what feature branches run through.
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (tsc typecheck + vite)
        working-directory: frontend
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend — unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      TEST_DB_NAME: cqm_test
      JWT_SECRET: ci-test-secret-not-used-in-production
      # The Anthropic SDK client is constructed at module load in the NEXUS AI
      # controllers; a dummy key lets those modules import in CI. No AI calls
      # are made by the unit suite.
      ANTHROPIC_API_KEY: dummy-key-for-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run unit tests
        working-directory: backend
        run: npx jest tests/unit --runInBand
