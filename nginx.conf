worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name qch;

        client_max_body_size 50m;

        location / {
            proxy_pass         http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }
    }
}
